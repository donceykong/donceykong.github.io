{% comment %}
  Interactive semantic map viewer.
  Usage: {% include semantic_map.html base="assets/projects/cu_multi/main_campus_robot1" title="..." caption="..." %}
  Expects <base>_map.bin, <base>_traj.bin and <base>_map.json (see _scripts/make_cu_multi_map.py).
{% endcomment %}
<figure class="semantic-map breakout"
        data-map="{{ include.base | append: '_map.bin' | relative_url }}"
        data-traj="{{ include.base | append: '_traj.bin' | relative_url }}"
        data-meta="{{ include.base | append: '_map.json' | relative_url }}">
  <div class="semantic-map__stage">
    <img class="semantic-map__poster" src="{{ include.base | append: '_thumb.png' | relative_url }}" alt="Top-down semantic map preview" loading="lazy">
    <div class="semantic-map__hud">
      <div>
        {% if include.title %}<div class="semantic-map__title">{{ include.title }}</div>{% endif %}
        <div class="semantic-map__stats"></div>
      </div>
      <div class="semantic-map__toolbar" role="toolbar" aria-label="Map view controls"></div>
    </div>
    <div class="semantic-map__status">Loading map…</div>
    <div class="semantic-map__hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
  </div>
  <div class="semantic-map__legend" aria-label="Semantic classes (click to toggle)"></div>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>

<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
<script src="{{ '/assets/js/semantic-map.js' | relative_url }}"></script>
